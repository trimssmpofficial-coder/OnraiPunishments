name: Import full project source
on:
  push:
    paths:
      - '_source/onrai-source.tar.gz'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand the initial source package
        run: |
          test -f _source/onrai-source.tar.gz
          tar -xzf _source/onrai-source.tar.gz -C .
          rm -rf _source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import complete plugin source and build configuration"
          git push origin HEAD:main
